name: Build Highway Racing

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: unzip -q HIGHWAY_RACING_GITHUB_CLOUD_BUILD.zip -d source

      - name: Build game
        run: |
          cd source/DIVYANSHU_HIGHWAY_RACING_ANDROID
          gradle --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: highway-racing-aab-unsigned
          path: source/DIVYANSHU_HIGHWAY_RACING_ANDROID/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
